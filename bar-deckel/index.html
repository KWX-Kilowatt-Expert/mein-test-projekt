<!DOCTYPE html>
<html lang="de">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#140f0b">
<title>Prediger Deckel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#140f0b; --bg2:#1c150f; --panel:#241b14; --panel2:#2e2219; --line:#3f3024;
  --ink:#efe4cf; --muted:#a8957b; --dim:#6f604e;
  --red:#a8322a; --red2:#c8443a; --gold:#d0a857; --gold2:#e8c77d; --green:#6f9a5b;
  --serif:"Cormorant Garamond", Georgia, serif; --sans:Inter, system-ui, sans-serif; --fraktur:"UnifrakturMaguntia", serif;
  --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;font-variant-numeric:lining-nums;background:var(--bg);color:var(--ink);font-family:var(--sans);overscroll-behavior:none}
body{background:radial-gradient(1200px 600px at 20% -10%,#2a1d14 0%,transparent 60%),var(--bg);user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
input{font:inherit;color:var(--ink)}
.num{font-variant-numeric:lining-nums tabular-nums}

/* ---------- Kopfzeile ---------- */
header{display:flex;align-items:center;gap:16px;padding:12px max(16px,env(safe-area-inset-right)) 12px max(16px,env(safe-area-inset-left));border-bottom:1px solid var(--line);background:rgba(20,15,11,.85);position:sticky;top:0;z-index:5;backdrop-filter:blur(8px)}
.logo{font-family:var(--fraktur);font-size:34px;color:var(--gold);line-height:1;letter-spacing:.5px}
.logo b{color:var(--red2);font-weight:400}
.sub{font-family:var(--serif);color:var(--muted);font-size:17px;font-style:italic}
.spacer{flex:1}
.kpi{display:flex;flex-direction:column;align-items:flex-end;line-height:1.15}
.kpi small{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.08em}
.kpi span{font-weight:600;font-size:18px}
.hbtn{padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel);font-weight:500;font-size:14px}
.hbtn:active{background:var(--panel2)}

/* ---------- Raumplan ---------- */
main{padding:16px max(16px,env(safe-area-inset-right)) 32px max(16px,env(safe-area-inset-left))}
.floor{display:grid;gap:12px;grid-template-columns:repeat(12,1fr);grid-auto-rows:minmax(150px,auto);
  grid-template-areas:
  "ph ph ph ph fe fe fe fe t2 t2 t2 t2"
  "pv pv pv sh sh sh sv sv sv t1 t1 t1"
  "ba ba ba ba ba ba ba ba ba xt xt xt"}
.area{background:linear-gradient(180deg,var(--panel),var(--bg2));border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.area.busy{border-color:#5a4330;box-shadow:inset 0 0 0 1px rgba(208,168,87,.08)}
.area h3{margin:0;display:flex;align-items:baseline;gap:8px;font-family:var(--serif);font-size:22px;font-weight:700;color:var(--gold2)}
.area h3 small{font-family:var(--sans);font-size:12px;color:var(--muted);font-weight:500;margin-left:auto}
.tabs{display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;flex:1}
.chip{display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-width:118px;padding:10px 12px;border-radius:12px;background:#33251a;border:1px solid #4b3826;text-align:left}
.chip:active{transform:scale(.97)}
.chip .n{font-family:var(--serif);font-size:20px;font-weight:700;line-height:1.05;max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip .s{font-size:13px;color:var(--gold);font-weight:600}
.chip .t{font-size:11px;color:var(--muted)}
.add{min-width:56px;min-height:58px;border-radius:12px;border:1.5px dashed #5a4632;color:var(--muted);font-size:28px;display:grid;place-items:center}
.add:active{background:#2a1f16}

/* ---------- Overlay: Deckel ---------- */
.sheet{position:fixed;inset:0;z-index:20;background:var(--bg);display:none;flex-direction:column}
.sheet.open{display:flex}
.sheethead{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--bg2)}
.back{width:48px;height:48px;border-radius:12px;background:var(--panel);border:1px solid var(--line);font-size:22px}
.guest{display:flex;flex-direction:column;line-height:1.1;min-width:0}
.guest b{font-family:var(--serif);font-size:28px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.guest span{color:var(--muted);font-size:13px}
.split{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 380px;grid-template-rows:minmax(0,1fr);min-height:0}
.picker{display:flex;flex-direction:column;min-height:0;min-width:0;border-right:1px solid var(--line)}
.cats{display:flex;gap:6px;padding:10px 12px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line)}
.cats::-webkit-scrollbar{display:none}
.cat{flex:none;padding:10px 14px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-size:14px;font-weight:500;white-space:nowrap;color:var(--muted)}
.cat.on{background:var(--red);border-color:var(--red2);color:#fff}
.search{margin:10px 12px 0;display:flex;gap:8px}
.search input{flex:1;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel);outline:none;font-size:16px}
.search input:focus{border-color:var(--gold)}
.grid{flex:1;overflow:auto;padding:12px;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;align-content:start}
.prod{position:relative;min-height:92px;padding:12px;border-radius:12px;background:linear-gradient(180deg,#2d2118,#241a13);border:1px solid var(--line);text-align:left;display:flex;flex-direction:column;justify-content:space-between;gap:6px}
.prod:active{transform:scale(.96);background:#3a2a1d}
.prod .pn{font-family:var(--serif);font-size:19px;font-weight:700;line-height:1.08}
.prod .pm{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;color:var(--muted)}
.prod .pp{color:var(--gold2);font-weight:600;font-size:14px}
.prod .badge{position:absolute;top:8px;right:8px;min-width:24px;height:24px;padding:0 7px;border-radius:12px;background:var(--red);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center}
.prod.fav{border-color:#5c4527}
.prod.flash{animation:flash .35s}
@keyframes flash{0%{box-shadow:0 0 0 0 rgba(232,199,125,.7)}100%{box-shadow:0 0 0 14px rgba(232,199,125,0)}}
.sectionlbl{grid-column:1/-1;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:6px 2px -2px}
.prod.custom{border-style:dashed;align-items:center;justify-content:center;text-align:center;color:var(--muted)}

/* Rechnung */
.bill{display:flex;flex-direction:column;min-height:0;background:#efe4cf;color:#2a1e15;position:relative}
.bill::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 30% 20%,rgba(120,80,40,.10),transparent 50%),radial-gradient(circle at 80% 70%,rgba(120,80,40,.12),transparent 45%);pointer-events:none}
.billhead{padding:14px 18px 8px;border-bottom:1px dashed #b9a586;position:relative}
.billhead .fr{font-family:var(--fraktur);font-size:26px;color:var(--red)}
.billhead small{display:block;color:#7a6650;font-size:12px}
.lines{flex:1;overflow:auto;padding:6px 10px;position:relative}
.line{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 8px;border-bottom:1px dotted #c8b598;align-items:center}
.line .ln{font-family:var(--serif);font-weight:700;font-size:19px;line-height:1.1}
.line .lt{grid-column:1;display:flex;align-items:center;gap:8px;color:#6d5a45;font-size:12px}
.line .lsum{font-weight:600;font-size:15px;text-align:right}
.line .ctl{grid-column:2;grid-row:1/3;display:flex;align-items:center;gap:6px}
.step{width:40px;height:40px;border-radius:10px;background:#e2d3b8;border:1px solid #c8b598;font-size:20px;font-weight:600;color:#3b2a1d}
.step:active{background:#d4c09e}
.step.plus{background:var(--red);border-color:var(--red);color:#fff}
.qty{min-width:22px;text-align:center;font-weight:700}
.tally{display:inline-flex;gap:5px;flex-wrap:wrap}
.tg{position:relative;display:inline-flex;gap:2px;height:14px}
.tg i{display:block;width:2px;height:14px;background:#5b3a26;border-radius:1px}
.tg.five::after{content:"";position:absolute;left:-2px;right:-2px;top:6px;height:2px;background:var(--red);transform:rotate(-24deg)}
.empty{padding:40px 20px;text-align:center;color:#8a7458;font-family:var(--serif);font-size:20px;font-style:italic}
.billfoot{padding:12px 16px 16px;border-top:2px solid #2a1e15;position:relative;background:#e7d9bf}
.total{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
.total span{font-size:13px;text-transform:uppercase;letter-spacing:.1em;color:#6d5a45}
.total b{font-size:34px;font-family:var(--serif)}
.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.abtn{padding:12px 6px;border-radius:12px;background:#dccaa8;border:1px solid #c3ad88;font-weight:600;font-size:13px;color:#3b2a1d}
.abtn.pay{grid-column:1/-1;background:var(--red);border-color:var(--red);color:#fff;font-size:18px;padding:16px}
.abtn:active{filter:brightness(.92)}
.abtn:disabled{opacity:.4}

/* ---------- Dialoge ---------- */
.modal{position:fixed;inset:0;z-index:40;background:rgba(8,5,3,.72);display:none;align-items:center;justify-content:center;padding:16px}
.modal.open{display:flex}
.box{width:min(560px,100%);max-height:92vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.box h2{margin:0 0 4px;font-family:var(--serif);font-size:30px;color:var(--gold2)}
.box p.hint{margin:0 0 14px;color:var(--muted);font-size:14px}
.field{width:100%;padding:14px 16px;border-radius:12px;border:1px solid var(--line);background:var(--bg2);font-size:20px;outline:none;font-family:var(--serif);font-weight:600}
.field:focus{border-color:var(--gold)}
.row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.btn{flex:1;padding:14px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);font-weight:600;font-size:16px;min-width:120px}
.btn.pri{background:var(--red);border-color:var(--red2);color:#fff}
.btn.gold{background:var(--gold);border-color:var(--gold2);color:#1c140d}
.btn:active{filter:brightness(1.15)}
.sugg{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.sugg button{padding:9px 14px;border-radius:999px;background:var(--bg2);border:1px solid var(--line);font-family:var(--serif);font-size:18px;font-weight:600}
.areas{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.areas button{padding:16px 8px;border-radius:12px;background:var(--bg2);border:1px solid var(--line);font-family:var(--serif);font-size:19px;font-weight:700}
.areas button.cur{border-color:var(--gold);color:var(--gold2)}
.paylines{margin:8px 0 10px;border-top:1px solid var(--line)}
.pl{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.pl .nm{font-family:var(--serif);font-size:18px;font-weight:700}
.pl .nm small{display:block;font-family:var(--sans);font-size:12px;color:var(--muted);font-weight:400}
.pl .pc{display:flex;align-items:center;gap:6px}
.pl .pc button{width:36px;height:36px;border-radius:10px;background:var(--bg2);border:1px solid var(--line);font-size:18px}
.pl .amt{min-width:70px;text-align:right;font-weight:600}
.bigtotal{display:flex;justify-content:space-between;align-items:baseline;padding:8px 0}
.bigtotal b{font-family:var(--serif);font-size:40px;color:var(--gold2)}
.cash{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:6px}
.cash button{padding:14px 4px;border-radius:12px;background:var(--bg2);border:1px solid var(--line);font-weight:600}
.cash button.on{border-color:var(--gold);color:var(--gold2)}
.change{margin-top:12px;padding:12px 14px;border-radius:12px;background:#1a2a17;border:1px solid #33502b;display:flex;justify-content:space-between;align-items:baseline}
.change b{font-size:26px;font-family:var(--serif);color:#a9d68f}
.link{color:var(--gold);text-decoration:underline;font-size:14px;padding:6px 0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.stat{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:12px}
.stat small{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.08em}
.stat b{font-size:22px;font-family:var(--serif)}
.list{border-top:1px solid var(--line)}
.li{display:flex;justify-content:space-between;gap:10px;padding:9px 2px;border-bottom:1px solid var(--line);font-size:14px}
.li span:first-child{color:var(--ink)} .li span:last-child{color:var(--muted)}
h4{margin:16px 0 6px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(120px);z-index:60;background:#0d0906;border:1px solid var(--gold);color:var(--ink);padding:10px 10px 10px 18px;border-radius:14px;display:flex;align-items:center;gap:14px;transition:transform .2s;box-shadow:0 10px 30px rgba(0,0,0,.5);max-width:calc(100% - 32px)}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast button{padding:9px 14px;border-radius:10px;background:var(--gold);color:#1c140d;font-weight:700}

/* ---------- Ergänzungen v2 ---------- */
.chip{min-width:0;flex:1 1 112px;max-width:220px;padding:8px 10px}
.chip .n{font-size:18px;max-width:100%}
.area .tabs .add{flex:0 0 52px;min-height:52px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;font-size:12px;font-weight:600;border:1px solid var(--line);background:var(--panel);white-space:nowrap}
.pill::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--muted)}
.pill.ok::before{background:#7fc46a;box-shadow:0 0 8px #7fc46a}
.pill.busy::before{background:var(--gold)}
.pill.off{border-color:#7a3a2a;color:#f0a58f}.pill.off::before{background:var(--red2)}
.pill.demo::before{background:#7aa6d8}
.hbtn .cnt{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;margin-left:6px;border-radius:10px;background:var(--red);color:#fff;font-size:11px;font-weight:700}
.hbtn .cnt[hidden]{display:none}
.hbtn.staff{border-color:#5c4527;color:var(--gold2)}
.loading{grid-column:1/-1;padding:60px;text-align:center;color:var(--muted);font-family:var(--serif);font-size:22px;font-style:italic}
.methods{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.methods button{padding:14px 6px;border-radius:12px;background:var(--bg2);border:1.5px solid var(--line);font-weight:700;font-size:15px;display:flex;flex-direction:column;align-items:center;gap:4px}
.methods button small{font-weight:500;font-size:11px;color:var(--muted)}
.methods button.on{border-color:var(--gold);color:var(--gold2);background:#2e2416}
.methods button.on.debt{border-color:var(--red2);color:#ffb3a6;background:#311a15}
.dl{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;padding:12px 4px;border-bottom:1px solid var(--line);text-align:left}
.dl:active{background:var(--panel2)}
.dl .who{font-family:var(--serif);font-size:20px;font-weight:700}
.dl .who small{display:block;font-family:var(--sans);font-size:12px;color:var(--muted);font-weight:400}
.dl .amt{font-weight:700;color:#f0a58f;white-space:nowrap}
.dl .amt.p{color:var(--gold2)}
.dl.done .who,.dl.done .amt{opacity:.55}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lbl{display:block;font-size:12px;color:var(--muted);margin:12px 0 6px;text-transform:uppercase;letter-spacing:.08em}
.stats.four{grid-template-columns:repeat(4,1fr)}
.stat.hl{border-color:var(--gold)} .stat.hl b{color:var(--gold2)}
.stat.red b{color:#f0a58f}
.daytabs{display:flex;gap:8px;margin:6px 0 2px}
.daytabs button{padding:8px 14px;border-radius:999px;background:var(--bg2);border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--muted)}
.daytabs button.on{border-color:var(--gold);color:var(--gold2)}
.tools{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.danger{color:#f0a58f}
.report{width:100%;height:46vh;margin-top:6px;padding:12px;border-radius:12px;border:1px solid var(--line);background:#0f0b08;color:var(--ink);font:13px/1.45 ui-monospace,Menlo,Consolas,monospace;resize:vertical;user-select:text;-webkit-user-select:text}
.catpick button.on{border-color:var(--gold);color:var(--gold2);background:#2e2416}
.catpick button[data-new]{border-style:dashed;color:var(--muted);font-family:var(--sans);font-size:15px}
.payrow{grid-column:1/-1;display:grid;grid-template-columns:1fr 1.5fr;gap:8px}
.payrow .abtn.pay{grid-column:auto;background:transparent;border:2px solid var(--red);color:var(--red);font-size:16px;padding:14px 6px}
.abtn.ok{background:linear-gradient(180deg,#3a9a3f,#2c7a31);border:1px solid #4cb552;color:#fff;font-size:19px;font-weight:700;padding:14px 6px;box-shadow:0 6px 18px rgba(44,122,49,.35)}
.abtn.ok:active{transform:scale(.97)}
.okfx{position:fixed;inset:0;z-index:70;display:none;align-items:center;justify-content:center;background:rgba(8,5,3,.55);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.okfx.show{display:flex;animation:okfade .2s ease-out}
.okcard{display:flex;flex-direction:column;align-items:center;gap:10px;padding:28px 34px 24px;border-radius:26px;background:#14200f;border:1px solid #3d9a41;box-shadow:0 20px 60px rgba(0,0,0,.6),0 0 0 6px rgba(61,154,65,.12);animation:okpop .42s cubic-bezier(.2,1.4,.4,1)}
.okcircle{width:120px;height:120px}
.okring{fill:#2c7a31;stroke:#6fd06f;stroke-width:4;stroke-dasharray:330;stroke-dashoffset:330;animation:okring .45s ease-out forwards}
.okcheck{fill:none;stroke:#fff;stroke-width:10;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:90;stroke-dashoffset:90;animation:okcheck .3s .3s ease-out forwards}
.okname{font-family:var(--serif);font-size:30px;font-weight:700;color:#eaf7e4}
.okinfo{font-size:15px;color:#a9d68f;font-weight:600}
@keyframes okfade{from{opacity:0}to{opacity:1}}
@keyframes okpop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes okring{to{stroke-dashoffset:0}}
@keyframes okcheck{to{stroke-dashoffset:0}}
.chip.pulse{animation:chippulse 1.6s ease-out}
@keyframes chippulse{0%{box-shadow:0 0 0 0 rgba(111,208,111,.9);border-color:#6fd06f}70%{box-shadow:0 0 0 16px rgba(111,208,111,0);border-color:#6fd06f}100%{box-shadow:none}}
.err{color:#f0a58f;font-size:14px;margin-top:8px;min-height:18px}

@media (max-width:1250px){ .sub{display:none} }
@media (max-width:1000px){
  .floor{grid-template-columns:1fr 1fr;grid-template-areas:"ph fe" "t2 pv" "sh sv" "t1 xt" "ba ba"}
  .split{grid-template-columns:minmax(0,1fr) 330px}
  .kpi.k2{display:none}
}
@media (max-width:720px){
  header{flex-wrap:wrap;gap:8px 10px;padding-top:max(10px,env(safe-area-inset-top))}
  .logo{font-size:28px}
  .kpi{display:none}
  .hbtn{padding:9px 11px;font-size:13px}
  .floor{grid-template-columns:1fr;grid-template-areas:"ba" "ph" "pv" "fe" "sh" "sv" "t1" "t2" "xt";grid-auto-rows:auto;gap:8px}
  .area{padding:10px 12px}.area h3{font-size:20px}
  .add{min-height:46px;min-width:46px;font-size:24px}.chip{min-width:0;flex:1 1 140px}
  .area{flex-direction:row;flex-wrap:wrap;align-items:center}.area h3{flex:1 1 auto}.area .tabs{flex:0 1 auto}.area.busy .tabs{flex-basis:100%}
  .toast{bottom:auto;top:10px;transform:translateX(-50%) translateY(-160px)}.toast.show{transform:translateX(-50%) translateY(0)}
  #toastMsg{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .split{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) 44%}
  .picker{border-right:0;border-bottom:1px solid var(--line)}

]],["Bier",[["Früh Kölsch",2.8,"0,2 l · vom Fass"],["Kranz Kölsch",28,"11 × 0,2 l"],["Jever Pils",4,"0,3 l · vom Fass"],["San Miguel",4,"0,3 l · vom Fass"],["Büble Dunkel (Halbe)",6,"0,5 l · vom Fass"],["Beck's",3.5,"0,33 l · Flasche"],["Andechser Weißbier",5,"0,5 l · Flasche"],["Jever Fun",3.5,"0,33 l · alkoholfrei"]]],["Kaffee",[["Espresso",1.5,""],["Espresso Doppio",3,""],["Kaffee",3,""],["Cappuccino",3.5,""],["Espresso Corretto",4,"1cl Grappa"],["Espresso Carajillo",4,"1cl Brandy"],["Coffee Baileys",6,"4cl Baileys"],["Coffee Kahlúa",6,"4cl Kahlúa"]]],["Alkoholfrei",[["Wasser 0,25",2.5,"Teinacher medium/naturell"],["Wasser 0,75",5.5,"Teinacher medium/naturell"],["Black Forest",3,"0,4 l"],["Coca Cola",3.5,"0,33 l"],["Cola Zero",3.5,"0,33 l"],["Red Bull",3.8,"0,25 l"],["Thomas Henry",3.5,"0,2 l · Tonic, Ginger Ale, Bitter Lemon …"],["Saft 0,2",3,"Ananas, Apfel, Grapefruit, Orange, Maracuja"],["Saft 0,4",5,"Ananas, Apfel, Grapefruit, Orange, Maracuja"],["Schorle 0,4",3.5,"Apfel, Orange, Maracuja …"]]]];

function r2(x){ return Math.round(x*100)/100; }
function slug(s){ return String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,""); }
function menuSeed(){
  var out=[]; MENU_CATS.forEach(function(c){ c[1].forEach(function(i){ out.push({id:slug(i[0]),cat:c[0],name:i[0],price:i[1],desc:i[2]}); }); });
  return out;
}
function emptyState(){ return {menu:[],tabs:[],debts:[],payments:[],expenses:[],closes:[],stats:{},regulars:[]}; }
function areaName(id){ for(var i=0;i<AREAS.length;i++) if(AREAS[i].id===id) return AREAS[i].name; return id; }
function tabTotal(t){ var s=0; for(var id in t.items){ var m=t.meta[id]||{price:0}; s+=m.price*t.items[id]; } return r2(s); }

}
function bumpStat(s,id,d){ if(id.indexOf("x-")===0) return; s.stats[id]=Math.max(0,(s.stats[id]||0)+d); if(!s.stats[id]) delete s.stats[id]; }
function applyOp(s, op){
  var t = op.tab ? findBy(s.tabs, op.tab) : null;
  switch(op.t){
    case "open":
      if(findBy(s.tabs,op.tab)) return;
      s.tabs.push({id:op.tab, area:op.area, name:op.name, opened:op.at, staff:op.staff||"", items:{}, meta:{}});
      addRegular(s,op.name); return;
    case "add":
      if(!t) return;
      var q=(t.items[op.item]||0)+op.d; if(q<0) return;
      if(op.d>0 && !t.meta[op.item]) t.meta[op.item]={name:op.name, price:Number(op.price)||0};
      if(q===0){ delete t.items[op.item]; delete t.meta[op.item]; } else t.items[op.item]=q;
      bumpStat(s,op.item,op.d); return;
    case "rename": if(t && op.name){ t.name=op.name; addRegular(s,op.name); } return;
    case "move": if(t) t.area=op.area; return;
    case "split":
      if(!t || findBy(s.tabs,op.newTab)) return;
      var nt={id:op.newTab, area:t.area, name:op.name||"Gast", opened:op.at, staff:op.staff||"", items:{}, meta:{}}, moved=0;
      for(var si in op.sel){
        var sn=Math.min(op.sel[si]||0, t.items[si]||0); if(sn<=0) continue;
        nt.items[si]=sn; nt.meta[si]=t.meta[si]; moved+=sn;
        if(t.items[si]-sn>0) t.items[si]-=sn; else { delete t.items[si]; delete t.meta[si]; }
      }
      if(!moved) return;
      s.tabs.push(nt); addRegular(s,nt.name);
      if(!Object.keys(t.items).length) s.tabs=s.tabs.filter(function(x){ return x!==t; });
      return;
    case "merge":
      var o=findBy(s.tabs,op.into); if(!t||!o||t===o) return;
      for(var id in t.items){ o.items[id]=(o.items[id]||0)+t.items[id]; if(!o.meta[id]) o.meta[id]=t.meta[id]; }
      s.tabs=s.tabs.filter(function(x){ return x!==t; }); return;
    case "drop":
      if(!t) return;
      for(var k in t.items) bumpStat(s,k,-t.items[k]);
      s.tabs=s.tabs.filter(function(x){ return x!==t; }); return;
    case "pay":
      if(!t) return;
      var lines=[], sum=0;
      for(var it in op.sel){
        var n=Math.min(op.sel[it]||0, t.items[it]||0); if(n<=0) continue;
        var m=t.meta[it]||{name:it,price:0};
        lines.push({name:m.name, price:m.price, qty:n}); sum+=m.price*n;
        if(t.items[it]-n>0) t.items[it]-=n; else { delete t.items[it]; delete t.meta[it]; }
      }
      sum=r2(sum); if(!lines.length) return;
      var emptied=Object.keys(t.items).length===0;
      if(op.method==="schulden"){
        s.debts.push({id:op.pid, name:op.debtName||t.name, created:op.at, amount:sum, paid:0, status:"offen", note:op.note||"", lines:lines, staff:op.staff||"", closed:0});
        addRegular(s,op.debtName||t.name);
      } else {
        s.payments.push({id:op.pid, day:op.day, at:op.at, name:t.name, area:t.area, method:op.method, amount:sum, kind:emptied?"deckel":"teil", lines:lines, staff:op.staff||""});
      }
      if(emptied) s.tabs=s.tabs.filter(function(x){ return x!==t; });
      return;
    case "debtNew":
      if(findBy(s.debts,op.pid)) return;
      s.debts.push({id:op.pid, name:op.name, created:op.at, amount:r2(op.amount), paid:0, status:"offen", note:op.note||"", lines:[], staff:op.staff||"", closed:0});
      addRegular(s,op.name); return;
    case "debtPay":
      var d=findBy(s.debts,op.debt); if(!d || d.status!=="offen") return;
      var amt=r2(Math.min(op.amount, d.amount-d.paid)); if(amt<=0) return;
      d.paid=r2(d.paid+amt);
      if(d.paid>=d.amount-0.001){ d.status="bezahlt"; d.closed=op.at; }
      s.payments.push({id:op.pid, day:op.day, at:op.at, name:d.name, area:"", method:op.method, amount:amt, kind:"schulden", lines:[], staff:op.staff||""});
      return;
    case "expense":
      if(findBy(s.expenses,op.pid)) return;
      s.expenses.push({id:op.pid, day:op.day, at:op.at, what:op.what, amount:r2(op.amount), staff:op.staff||""}); return;
    case "menuSet":
      var mi=op.item, ex=findBy(s.menu,mi.id);
      var clean={id:mi.id, cat:mi.cat||"Sonstiges", name:mi.name, price:Number(mi.price)||0, desc:mi.desc||""};
      if(ex) s.menu[s.menu.indexOf(ex)]=clean; else s.menu.push(clean); return;
    case "menuDel": s.menu=s.menu.filter(function(x){ return x.id!==op.item; }); return;
    case "resetStats": s.stats={}; return;
    case "close":
      s.closes=s.closes||[]; if(findBy(s.closes,op.pid)) return;
      var rep=op.report||{}; rep.id=op.pid; rep.at=op.at; rep.staff=op.staff||""; s.closes.push(rep); return;
  }
}
function fmtE(n){
  n=Number(n)||0; var neg=n<-0.004; var p=Math.abs(Math.round(n*100)/100).toFixed(2).split(".");
  p[0]=p[0].replace(/\B(?=(\d{3})+(?!\d))/g,"."); return (neg?"−":"")+p[0]+","+p[1]+" €";
}
function reportText(r){
  function L(a,b){ a=String(a); b=String(b); while(a.length<22) a+="."; while(b.length<11) b=" "+b; return a+" "+b; }
  var out=["PREDIGER · TAGESABSCHLUSS", r.dateLabel||r.day, "Abgeschlossen "+(r.timeStr||"")+" von "+(r.staff||"–"), "",
    "EINNAHMEN ("+(r.payCount||0)+" Zahlungen)", L("Bar",fmtE(r.bar)), L("EC-Karte",fmtE(r.ec)), L("PayPal",fmtE(r.paypal)), L("Gesamt",fmtE(r.total))];
  if(r.debtPaid) out.push(L("davon Schulden bezahlt",fmtE(r.debtPaid)));
  out.push("", "KASSE (BAR)", L("Wechselgeld Anfang",fmtE(r.start)), L("+ Bar-Einnahmen",fmtE(r.bar)), L("− Auslagen",fmtE(r.exp)), L("= Soll",fmtE(r.soll)),
    L("Gezählt",fmtE(r.counted)), L("DIFFERENZ",(r.diff>0.004?"+":"")+fmtE(r.diff)), L("Wechselgeld bleibt",fmtE(r.float)), L("ENTNAHME",fmtE(r.take)));
  if(r.ecTerm!==null && r.ecTerm!==undefined) out.push("", L("EC laut Terminal",fmtE(r.ecTerm)), L("EC laut App",fmtE(r.ec)), L("Abweichung EC",fmtE(r.ecTerm-r.ec)));
  if(r.exps && r.exps.length){ out.push("","AUSLAGEN"); r.exps.forEach(function(x){ out.push(L(String(x[0]).slice(0,22),fmtE(x[1]))); }); }
  if(r.debts && r.debts.length){ out.push("","ANGESCHRIEBEN ("+fmtE(r.debtNew)+")"); r.debts.forEach(function(x){ out.push(L(String(x[0]).slice(0,22),fmtE(x[1]))); }); }
  out.push("", L("Offene Deckel",(r.openCount||0)+" · "+fmtE(r.openSum)));
  if(r.top && r.top.length){ out.push("","RENNER"); r.top.forEach(function(x){ var q=String(x[1]); while(q.length<3) q=" "+q; out.push(q+"× "+x[0]); }); }
  if(r.note) out.push("", "NOTIZ: "+r.note);
  return out.join("\n");
}

<script>
/* =========================================================

const DEMO = !(window.google && google.script && google.script.run);
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
const esc = s => String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const eur = n => (Math.round((n||0)*100)/100).toLocaleString("de-DE",{minimumFractionDigits:2,maximumFractionDigits:2})+" €";
const numIn = n => (Math.round(n*100)/100).toLocaleString("de-DE",{minimumFractionDigits:2,maximumFractionDigits:2,useGrouping:false});
const parseEur = s => { s=String(s||"").trim().replace(/[€\s]/g,""); if(s.includes(",")) s=s.replace(/\./g,"").replace(",","."); const n=parseFloat(s); return isNaN(n)?NaN:Math.round(n*100)/100; };
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,8);
// Barnacht zählt bis 8 Uhr morgens zum Vortag
const dayKey = (d=new Date()) => { const x=new Date(d); if(x.getHours()<8) x.setDate(x.getDate()-1); return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0"); };
const dayLabel = k => new Date(k+"T12:00").toLocaleDateString("de-DE",{weekday:"long",day:"numeric",month:"long"});
const timeStr = t => new Date(t).toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"});
const dateStr = t => new Date(t).toLocaleDateString("de-DE",{day:"2-digit",month:"2-digit"});
const focusLater = (sel,ms=60) => setTimeout(()=>{ const el=$(sel); if(el) el.focus(); },ms);
const LS = {
  get(k,d){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
};

/* =========================================================
   Daten & Abgleich
   Jede Eingabe ist eine kleine Aktion („op“). Sie wird sofort
   lokal angezeigt und dann an Google Sheets geschickt. Klappt das
   Netz nicht, bleibt sie gespeichert und wird nachgeschickt.
   ========================================================= */
let base = LS.get("pd-base",null), rev = LS.get("pd-rev",0), pending = LS.get("pd-pending",[]);
let pin = LS.get("pd-pin",""), staff = LS.get("pd-staff","");
let V = null;

function computeView(){
  if(!base){ V=null; return; }
  const s=JSON.parse(JSON.stringify(base));
  pending.forEach(op=>{ try{ applyOp(s,op); }catch(e){ console.error(e); } });
  V=s;
}
function dispatch(op){
  op.id=uid(); op.at=op.at||Date.now(); op.day=dayKey(new Date(op.at)); op.staff=staff;
  pending.push(op); LS.set("pd-pending",pending);
  refresh(); syncSoon(150);
}

function call(req){
  if(DEMO) return new Promise(r=>setTimeout(()=>r(mockApi(JSON.parse(JSON.stringify(req)))),120));
  return new Promise((res,rej)=>google.script.run.withSuccessHandler(res).withFailureHandler(rej).api(req));
}
// Demo ohne Google: gleicher Ablauf, Daten nur in diesem Browser
function mockApi(req){
  let db=LS.get("pd-mock",null);
  if(!db){ db={rev:1,s:emptyState(),done:[]}; db.s.menu=menuSeed(); LS.set("pd-mock",db); }
  if(req.ops.length){
    req.ops.forEach(op=>{ if(db.done.includes(op.id)) return; applyOp(db.s,op); db.done.push(op.id); });
    db.done=db.done.slice(-2000); db.rev++; LS.set("pd-mock",db);
    return {ok:true,rev:db.rev,state:db.s};
  }
  return req.since===db.rev ? {ok:true,rev:db.rev} : {ok:true,rev:db.rev,state:db.s};
}

let inflight=false, syncTimer=null, fails=0;
function syncSoon(ms){ clearTimeout(syncTimer); syncTimer=setTimeout(sync,ms); }
async function sync(){
  if(inflight || (!DEMO && !pin)) return;
  inflight=true;
  const batch=pending.slice(0,40);
  if(batch.length) setStatus("busy");
  try{
    const res=await call({pin, since:rev, ops:batch});
    if(!res || !res.ok){
      if(res && res.error==="pin"){ pin=""; LS.set("pd-pin",""); showLogin("Die PIN stimmt nicht (mehr)."); return; }
      throw new Error("Serverfehler");
    }
    const ids=new Set(batch.map(o=>o.id));
    pending=pending.filter(o=>!ids.has(o.id)); LS.set("pd-pending",pending);
    let changed=batch.length>0;
    if(res.state){ if(JSON.stringify(res.state)!==JSON.stringify(base)){ base=res.state; LS.set("pd-base",base); changed=true; } }
    rev=res.rev; LS.set("pd-rev",rev); fails=0; setStatus("ok");
    if(changed) refresh();
  }catch(e){ fails++; setStatus("off"); console.warn(e); }
  finally{
    inflight=false;
    if(pending.length) syncSoon(fails ? Math.min(30000,2000*fails) : 50);
  }
}
setInterval(()=>{ if(!document.hidden) sync(); }, 4000);
document.addEventListener("visibilitychange",()=>{ if(!document.hidden) sync(); });

function setStatus(s){
  const el=$("#sync");
  if(DEMO && s!=="busy"){ el.className="pill demo"; el.textContent="Demo · nur dieses Gerät"; return; }
  el.className="pill "+s;
  el.textContent = s==="ok" ? "Live" : s==="busy" ? "Speichert …" : `Offline · ${pending.length} offen`;
}

    const sum=Math.round(ids.reduce((s,id)=>s+lineItem(t,id).price*(sel[id]||0),0)*100)/100;

      <div class="paylines">${ids.map(id=>{const p=lineItem(t,id);return `<div class="pl"><div class="nm">${esc(p.name)}<small class="num">${sel[id]||0} von ${t.items[id]} · à ${eur(p.price)}</small></div>

    $$("[data-u]").forEach(b=>b.onclick=()=>{ const id=b.dataset.u; sel[id]=Math.min(t.items[id],(sel[id]||0)+1); draw(); });

      toast(`Eigener Deckel für ${nm} · ${eur(sum)}`,false);

      splitDialog();
    };
  };
  draw();
}

/* ---------- Abrechnen ---------- */
$("#btnPay").onclick=()=>payDialog();
function methodBtns(m,withDebt){
  const list=[["bar","Bar","Rückgeld"],["ec","EC-Karte",""],["paypal","PayPal",""]]; if(withDebt) list.push(["schulden","Anschreiben","Schuldenbuch"]);
  return `<div class="methods">${list.map(([k,l,s])=>`<button data-me="${k}" class="${m===k?"on":""}${k==="schulden"?" debt":""}">${l}${s?`<small>${s}</small>`:""}</button>`).join("")}</div>`;
}
function payDialog(){
  const t=T(); const sel={...t.items}; let given=null, method="bar";
  let debtName=/^Gast \d+$/.test(t.name)?"":t.name, note="";
  const draw=()=>{
    const ids=Object.keys(t.items);
    const sum=Math.round(ids.reduce((s,id)=>s+lineItem(t,id).price*(sel[id]||0),0)*100)/100;
    const all=ids.every(id=>(sel[id]||0)===t.items[id]);
    const opts=[...new Set([sum,Math.ceil(sum/5)*5,Math.ceil(sum/10)*10,Math.ceil(sum/20)*20,Math.ceil(sum/50)*50].filter(v=>v>=sum&&v>0))].slice(0,4);
    const okLabel = method==="schulden" ? `${eur(sum)} anschreiben` : all ? `${eur(sum)} bezahlt · ${METHODS[method]}` : `Teilbetrag ${eur(sum)} bezahlt`;
    modal(`<h2>Abrechnen · ${esc(t.name)}</h2>
      <p class="hint">Getrennt zahlen? Mengen mit − / + anpassen – der Rest bleibt auf dem Deckel.</p>
      <div class="paylines">${ids.map(id=>{const p=lineItem(t,id);return `<div class="pl"><div class="nm">${esc(p.name)}<small class="num">${sel[id]||0} von ${t.items[id]} · à ${eur(p.price)}</small></div>
        <div class="pc"><button data-d="${esc(id)}">−</button><button data-u="${esc(id)}">+</button></div><div class="amt num">${eur(p.price*(sel[id]||0))}</div></div>`}).join("")}</div>
      <div style="display:flex;gap:14px"><button class="link" id="sAll">alles</button><button class="link" id="sNone">nichts</button></div>
      <div class="bigtotal"><span>${all?"Gesamt":"Teilbetrag"}</span><b class="num">${eur(sum)}</b></div>
      ${sum>0?`<div class="hint" style="margin:-4px 0 6px">Geteilt durch: ${[2,3,4,5,6].map(n=>`<b>${n}</b> → ${eur(Math.ceil(sum/n*100)/100)}`).join(" · ")}</div>`:""}
      <span class="lbl">Zahlart <span style="text-transform:none;letter-spacing:0">(nur zur Dokumentation – kassiert wird wie gewohnt am Terminal / per PayPal)</span></span>${methodBtns(method,true)}
      ${method==="bar"?`<span class="lbl">Gegeben (optional, fürs Rückgeld)</span>
        <div class="cash">${opts.map(v=>`<button class="num${given===v?" on":""}" data-g="${v}">${eur(v)}</button>`).join("")}</div>
        ${given!=null&&given>=sum?`<div class="change"><span>Rückgeld</span><b class="num">${eur(given-sum)}</b></div>`:""}`:""}
      ${method==="schulden"?`<span class="lbl">Wer schuldet? (richtiger Name!)</span>
        <input class="field" id="dn" value="${esc(debtName)}" placeholder="Name" autocomplete="off">
        <input class="field" id="dno" value="${esc(note)}" placeholder="Notiz (optional), z. B. zahlt Freitag" style="margin-top:8px;font-size:16px;font-family:var(--sans);font-weight:400">`:""}
      <div class="err" id="pe"></div>
      <div class="row"><button class="btn" id="cx">Abbrechen</button><button class="btn gold" id="ok" ${sum>0?"":"disabled"}>${okLabel}</button></div>`);
    $$("[data-d]").forEach(b=>b.onclick=()=>{ const id=b.dataset.d; sel[id]=Math.max(0,(sel[id]||0)-1); given=null; draw(); });
    $$("[data-u]").forEach(b=>b.onclick=()=>{ const id=b.dataset.u; sel[id]=Math.min(t.items[id],(sel[id]||0)+1); given=null; draw(); });
    $$("[data-g]").forEach(b=>b.onclick=()=>{ given=parseFloat(b.dataset.g); draw(); });
    $$("[data-me]").forEach(b=>b.onclick=()=>{ method=b.dataset.me; draw(); });
    if($("#dn")){ $("#dn").oninput=e=>debtName=e.target.value; $("#dno").oninput=e=>note=e.target.value; }
    $("#sAll").onclick=()=>{ Object.assign(sel,t.items); given=null; draw(); };
    $("#sNone").onclick=()=>{ ids.forEach(id=>sel[id]=0); given=null; draw(); };
    $("#cx").onclick=()=>closeModal();
    $("#ok").onclick=()=>{
      if(method==="schulden" && !debtName.trim()){ $("#pe").textContent="Zum Anschreiben bitte den Namen eintragen."; $("#dn").focus(); return; }
      const s={}; ids.forEach(id=>{ if(sel[id]>0) s[id]=sel[id]; });
      closeModal();
      if(all){ cur=null; closeTab(); }
      dispatch({t:"pay",tab:t.id,sel:s,method,pid:uid(),debtName:debtName.trim(),note:note.trim()});
      toast(method==="schulden" ? `${eur(sum)} bei ${debtName.trim()} angeschrieben` : `${t.name}: ${eur(sum)} · ${METHODS[method]} ✓`, false);
    };
  };
  draw();
}

      ${d.lines.length?`<div class="list">${d.lines.map(l=>`<div class="li"><span>${l.qty}× ${esc(l.name)}</span><span class="num">${eur(l.price*l.qty)}</span></div>`).join("")}</div>`:""}

   Kasse / Tagesübersicht
   ========================================================= */
$("#btnDay").onclick=()=>dayDialog();
function dayFigures(day){
  const pays=V.payments.filter(p=>p.day===day).sort((a,b)=>b.at-a.at);
  const by=k=>Math.round(pays.filter(p=>p.method===k).reduce((s,p)=>s+p.amount,0)*100)/100;
  const exps=V.expenses.filter(e=>e.day===day).sort((a,b)=>b.at-a.at);
  const newDebts=V.debts.filter(d=>dayKey(new Date(d.created))===day);
  const top={}; pays.forEach(p=>(p.lines||[]).forEach(l=>top[l.name]=(top[l.name]||0)+l.qty));
  newDebts.forEach(d=>(d.lines||[]).forEach(l=>top[l.name]=(top[l.name]||0)+l.qty));
  const r2=x=>Math.round(x*100)/100;
  return { pays, exps, newDebts,
    bar:by("bar"), ec:by("ec"), paypal:by("paypal"),
    total:r2(pays.reduce((s,p)=>s+p.amount,0)),
    exp:r2(exps.reduce((s,e)=>s+e.amount,0)),
    debtNew:r2(newDebts.reduce((s,d)=>s+d.amount,0)),
    debtPaid:r2(pays.filter(p=>p.kind==="schulden").reduce((s,p)=>s+p.amount,0)),
    openSum:r2(V.tabs.reduce((s,t)=>s+tabTotal(t),0)), openCount:V.tabs.length,
    top:Object.entries(top).sort((a,b)=>b[1]-a[1]).slice(0,8) };
}

    ${closes.length?`<div class="list">${closes.map(c=>`<button class="dl" data-cl="${c.id}"><span class="who">✓ Abgeschlossen ${timeStr(c.at)}<small>${esc(c.staff)} · Differenz ${eur(c.diff)}</small></span><span class="amt p">Bericht ›</span></button>`).join("")}</div>`:""}

/* ---------- Tagesabschluss / Kassensturz ---------- */
function closeDialog(day){
  const f=dayFigures(day);
  const last=(V.closes||[]).slice().sort((a,b)=>b.at-a.at)[0];
  const v={start:last?numIn(last.float):"", counted:"", float:last?numIn(last.float):"", ecTerm:"", note:""};
  const draw=()=>{
    modal(`<h2>Tagesabschluss</h2><p class="hint">${dayLabel(day)} · Kasse zählen und eintragen.</p>
      ${f.openCount?`<div class="change" style="background:#311a15;border-color:#7a3a2a;display:block"><b style="font-size:18px;color:#f0a58f">⚠ Noch ${f.openCount} Deckel offen (${eur(f.openSum)})</b><div style="font-size:13px;color:var(--muted);margin-top:4px">Erst abrechnen oder anschreiben – sonst bleiben sie für morgen stehen.</div></div>`:""}
      <div class="cols2">
        <div><span class="lbl">Wechselgeld Anfang</span><input class="field num" id="cS" inputmode="decimal" placeholder="z. B. 150" value="${esc(v.start)}"></div>
        <div><span class="lbl">Bar gezählt (gesamt)</span><input class="field num" id="cC" inputmode="decimal" placeholder="alles in der Kasse" value="${esc(v.counted)}"></div>
        <div><span class="lbl">Bleibt als Wechselgeld drin</span><input class="field num" id="cF" inputmode="decimal" placeholder="z. B. 150" value="${esc(v.float)}"></div>
        <div><span class="lbl">EC laut Terminal (optional)</span><input class="field num" id="cE" inputmode="decimal" placeholder="${eur(f.ec)}" value="${esc(v.ecTerm)}"></div>
      </div>
      <span class="lbl">Notiz (optional)</span><input class="field" id="cN" value="${esc(v.note)}" placeholder="z. B. 2 € Differenz, Trinkgeld geteilt" style="font-size:16px;font-family:var(--sans);font-weight:400">
      <div id="cCalc"></div>
      <div class="err" id="cErr"></div>
      <div class="row"><button class="btn" id="cx">Zurück</button><button class="btn gold" id="ok">Abschluss speichern</button></div>`);
    const calc=()=>{
      v.start=$("#cS").value; v.counted=$("#cC").value; v.float=$("#cF").value; v.ecTerm=$("#cE").value; v.note=$("#cN").value;
      const st=parseEur(v.start)||0, c=parseEur(v.counted), fl=parseEur(v.float)||0;
      const soll=Math.round((st+f.bar-f.exp)*100)/100;
      const diff=isNaN(c)?null:Math.round((c-soll)*100)/100;
      const col=diff===null?"var(--muted)":Math.abs(diff)<0.005?"#a9d68f":diff<0?"#f0a58f":"var(--gold2)";
      $("#cCalc").innerHTML=`<div class="list" style="margin-top:14px">
        <div class="li"><span>Wechselgeld Anfang</span><span class="num">${eur(st)}</span></div>
        <div class="li"><span>+ Bar-Einnahmen</span><span class="num">${eur(f.bar)}</span></div>
        <div class="li"><span>− Auslagen</span><span class="num">${eur(f.exp)}</span></div>
        <div class="li"><span><b>= Soll in der Kasse</b></span><span class="num"><b>${eur(soll)}</b></span></div>
        <div class="li"><span>Gezählt</span><span class="num">${isNaN(c)?"–":eur(c)}</span></div></div>
        <div class="change" style="border-color:${col};background:${diff!==null&&diff<-0.005?"#311a15":diff!==null&&diff>0.005?"#2e2416":"#1a2a17"}"><span>Differenz</span><b class="num" style="color:${col}">${diff===null?"–":(diff>0?"+ ":"")+eur(diff)}</b></div>
        ${!isNaN(c)?`<div class="bigtotal"><span>Entnahme (geht raus)</span><b class="num">${eur(c-fl)}</b></div>`:""}`;
    };
    ["#cS","#cC","#cF","#cE","#cN"].forEach(id=>$(id).oninput=calc); calc();
    focusLater(v.start?"#cC":"#cS");
    $("#cx").onclick=()=>dayDialog(day);
    $("#ok").onclick=()=>{
      calc();
      const st=parseEur(v.start), c=parseEur(v.counted), fl=parseEur(v.float), et=parseEur(v.ecTerm);
      if(isNaN(c)){ $("#cErr").textContent="Bitte den gezählten Bargeld-Betrag eintragen."; $("#cC").focus(); return; }
      const r2=x=>Math.round(x*100)/100, s0=isNaN(st)?0:st, f0=isNaN(fl)?0:fl, soll=r2(s0+f.bar-f.exp);
      const report={day, bar:f.bar, ec:f.ec, paypal:f.paypal, total:f.total, exp:f.exp, start:s0, soll, counted:c, diff:r2(c-soll),
        float:f0, take:r2(c-f0), ecTerm:isNaN(et)?null:et, debtNew:f.debtNew, debtPaid:f.debtPaid, openSum:f.openSum, openCount:f.openCount,
        note:v.note.trim(), payCount:f.pays.length, timeStr:timeStr(Date.now()), dateLabel:new Date(day+"T12:00").toLocaleDateString("de-DE",{weekday:"long",day:"numeric",month:"long",year:"numeric"}),
        exps:f.exps.map(e=>[e.what,e.amount]), debts:f.newDebts.map(d=>[d.name,d.amount]), top:f.top};
      const pid=uid(); dispatch({t:"close",pid,report});
      reportDialog(V.closes.find(x=>x.id===pid)||Object.assign({id:pid,at:Date.now(),staff},report),day);
    };
  };
  draw();
}

    <div class="row"><button class="btn" id="cx">Zurück</button><button class="btn pri" id="ok">Auslage buchen</button></div>`);
  focusLater("#ew",50);
  $("#cx").onclick=()=>dayDialog();
  $("#ok").onclick=()=>{ const w=$("#ew").value.trim(), a=parseEur($("#ea").value);
    if(!w||!(a>0)){ $("#ee").textContent="Bitte Zweck und Betrag eingeben."; return; }
    dispatch({t:"expense",pid:uid(),what:w,amount:a}); toast(`Auslage ${eur(a)} gebucht`,false); dayDialog(); };
}

/* =========================================================
   Karte bearbeiten
   ========================================================= */
function menuDialog(cat){
  const cats=catList(); cat=cat&&cats.includes(cat)?cat:cats[0];
  modal(`<h2>Karte bearbeiten</h2><p class="hint">Änderungen gelten sofort auf allen Geräten. Preise kann man auch direkt in der Google-Tabelle im Blatt „Karte“ ändern.</p>
    <div class="sugg">${cats.map(c=>`<button data-mc="${esc(c)}" style="${c===cat?"border-color:var(--gold);color:var(--gold2)":""}">${esc(c)}</button>`).join("")}</div>
    <div style="margin-top:10px">${V.menu.filter(m=>m.cat===cat).map(m=>`<button class="dl" data-mi="${esc(m.id)}"><span class="who">${esc(m.name)}<small>${esc(m.desc)}</small></span><span class="amt p num">${eur(m.price)}</span></button>`).join("")}</div>
    <div class="row"><button class="btn" id="mn">+ Neuer Artikel</button><button class="btn pri" id="cx">Fertig</button></div>`);
  $$("[data-mc]").forEach(b=>b.onclick=()=>menuDialog(b.dataset.mc));
  $$("[data-mi]").forEach(b=>b.onclick=()=>itemDialog(prod(b.dataset.mi),cat));
  $("#mn").onclick=()=>itemDialog(null,cat);
  $("#cx").onclick=()=>closeModal();
}
function itemDialog(m,cat){
  const isNew=!m; m=m||{id:"m-"+uid(),cat,name:"",price:"",desc:""};
  modal(`<h2>${isNew?"Neuer Artikel":"Artikel ändern"}</h2>
    <span class="lbl">Name</span><input class="field" id="in" value="${esc(m.name)}" autocomplete="off">
    <span class="lbl">Preis €</span><input class="field num" id="ip" inputmode="decimal" value="${m.price===""?"":numIn(m.price)}">
    <span class="lbl">Kategorie</span>${catPicker("ic",m.cat)}
    <span class="lbl">Info (klein darunter)</span><input class="field" id="id" value="${esc(m.desc)}" style="font-size:16px;font-family:var(--sans);font-weight:400">
    <div class="err" id="ie"></div>
    <div class="row">${isNew?"":`<button class="btn danger" id="del">Löschen</button>`}<button class="btn" id="cx">Zurück</button><button class="btn pri" id="ok">Speichern</button></div>`);
  wireCatPicker("ic");
  $("#cx").onclick=()=>menuDialog(cat);
  if($("#del")) $("#del").onclick=()=>{ if(confirm(`„${m.name}“ von der Karte nehmen? Offene Deckel behalten ihren Preis.`)){ dispatch({t:"menuDel",item:m.id}); menuDialog(cat); } };
  $("#ok").onclick=()=>{ const n=$("#in").value.trim(), p=parseEur($("#ip").value), c=$("#ic").value.trim()||"Sonstiges";
    if(!n||!(p>=0)){ $("#ie").textContent="Bitte Name und Preis eingeben."; return; }
    dispatch({t:"menuSet",item:{id:m.id,cat:c,name:n,price:p,desc:$("#id").value.trim()}}); menuDialog(c); };
}

/* =========================================================
   Start
   ========================================================= */
$("#today").textContent=new Date().toLocaleDateString("de-DE",{weekday:"long",day:"numeric",month:"long"});
if(staff) $("#btnStaff").textContent="👤 "+staff;
setStatus(DEMO?"ok":"busy");
if(base) refresh();
if(!DEMO && !pin) showLogin();
else if(!staff) staffDialog();
sync();
setInterval(()=>{ if(V && !cur) renderFloor(); },60000);
</script>
